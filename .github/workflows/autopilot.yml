name: SAUL AI TRADER - Piloto Automatico 24/7

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-trader:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar ciclo de trading
        run: |
          python3 bot_worker.py

      - name: Guardar estado de base de datos
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SAUL AI TRADER Bot"
          git add saul_trader.db
          git diff --staged --quiet || git commit -m "Auto-update: Ciclo de trading 24/7"
          git push
